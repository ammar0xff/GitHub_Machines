name: Windows
on:
  workflow_dispatch:
  repository_dispatch:
    types: [machine-windows]
concurrency:
  group: windows-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: windows-latest
    timeout-minutes: 435
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download bore
        run: |
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .

      - name: Download ttyd
        run: |
          Invoke-WebRequest "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.win32.exe" -OutFile ttyd.exe

      - name: Download filebrowser
        run: |
          Invoke-WebRequest "https://github.com/filebrowser/filebrowser/releases/download/v2.63.23/windows-amd64-filebrowser.zip" -OutFile filebrowser.zip
          Expand-Archive filebrowser.zip -DestinationPath filebrowser-dist

      - name: Configure filebrowser
        run: |
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:TEMP\fb" | Out-Null
          Push-Location "$env:TEMP\fb"
          & $fb config init
          & $fb users add runner "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" --perm.admin
          Pop-Location

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" -Force)

      - name: Start services
        run: |
          Start-Process -FilePath ".\ttyd.exe" -ArgumentList @("-W","-p","8080","cmd.exe") -WindowStyle Hidden
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $fb -ArgumentList @("-r","C:\","-a","0.0.0.0","-p","8081") -WorkingDirectory "$env:TEMP\fb" -WindowStyle Hidden

      - name: Create tunnels
        run: |
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","8080","--to","bore.pub") -RedirectStandardOutput bore8080.out -RedirectStandardError bore8080.err
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","8081","--to","bore.pub") -RedirectStandardOutput bore8081.out -RedirectStandardError bore8081.err
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","3389","--to","bore.pub") -RedirectStandardOutput bore3389.out -RedirectStandardError bore3389.err
          Start-Sleep -Seconds 12

          $t = $null
          $f = $null
          $r = $null
          if ((Get-Content bore8080.err -Raw -ErrorAction SilentlyContinue) -match "listening at (\S+)") { $t = $matches[1] }
          if ((Get-Content bore8081.err -Raw -ErrorAction SilentlyContinue) -match "listening at (\S+)") { $f = $matches[1] }
          if ((Get-Content bore3389.err -Raw -ErrorAction SilentlyContinue) -match "listening at (\S+)") { $r = $matches[1] }
          $PASS = "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"

          if ($t) {
            Write-Output "MAROHUB_TERMINAL=http://$t"
            Write-Output "::notice title=Web terminal::http://$t"
          }
          if ($f) {
            Write-Output "MAROHUB_FILES=http://$f"
            Write-Output "::notice title=File manager::http://$f  (user runner / password $PASS)"
          }
          if ($r) {
            Write-Output "MAROHUB_RDP=$r"
            Write-Output "::notice title=Remote Desktop::$r  (user runneradmin / password $PASS)"
          }

          if (-not $t -and -not $f -and -not $r) {
            Write-Output "::error::bore did not report any endpoints."
            Get-Content bore8080.err,bore8081.err,bore3389.err -ErrorAction SilentlyContinue
          }

          $summary = "## Windows machine`n`n"
          if ($t) { $summary += "* **Terminal** (any browser): http://$t`n" }
          if ($f) { $summary += "* **Files** (filebrowser): http://$f - user ``runner``, password ``$PASS`` `n" }
          if ($r) { $summary += "* **Desktop** (RDP client): $r - user ``runneradmin``, password ``$PASS`` `n" }
          $summary += "`n> The machine lives until this run ends or ~6h, whichever comes first."
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish state
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          $pass = "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"
          $ep = @{}
          if ($t) { $ep["MAROHUB_TERMINAL"] = "http://$t" }
          if ($f) { $ep["MAROHUB_FILES"] = "http://$f" }
          if ($r) { $ep["MAROHUB_RDP"] = "$r" }
          $state = @{ run_id = $env:RUN_ID; endpoints = $ep } | ConvertTo-Json -Compress
          $repo = "$env:GITHUB_REPOSITORY"
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($state))
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $uri = "https://api.github.com/repos/$repo/git/refs"
          $branchRef = "refs/heads/machine-state/windows"
          try {
            $head = Invoke-RestMethod -Method GET "$uri/heads/machine-state/windows" -Headers $headers
          } catch { $head = $null }
          $commit = Invoke-RestMethod -Method POST "https://api.github.com/repos/$repo/git/trees" `
            -Headers $headers -ContentType "application/json" `
            -Body (@{ base_tree = if ($head) { $head.object.sha } else { $null }; tree = @(@{ path = ".machine-state/windows.json"; mode = "100644"; type = "blob"; content = $state }) } | ConvertTo-Json -Depth 6 -Compress)
          $commitBody = @{
            message  = "machine state"
            tree     = $commit.sha
            parents  = if ($head) { @($head.object.sha) } else { @() }
          } | ConvertTo-Json -Depth 6 -Compress
          $newCommit = Invoke-RestMethod -Method POST "https://api.github.com/repos/$repo/git/commits" `
            -Headers $headers -ContentType "application/json" -Body $commitBody
          if ($head) {
            Invoke-RestMethod -Method PATCH "$uri/heads/machine-state/windows" -Headers $headers `
              -ContentType "application/json" `
              -Body (@{ sha = $newCommit.sha; force = $true } | ConvertTo-Json -Compress) | Out-Null
          } else {
            Invoke-RestMethod -Method POST $uri -Headers $headers -ContentType "application/json" `
              -Body (@{ ref = $branchRef; sha = $newCommit.sha } | ConvertTo-Json -Compress) | Out-Null
          }

      - name: Keep the machine alive
        run: |
          # Bore tunnels started in the previous step keep running as this job stays open,
          # so GitHub emits this run only when it is cancelled or the 6h window ends.
          Wait-Process -Name bore -ErrorAction SilentlyContinue