name: Windows
on:
  workflow_dispatch:
  repository_dispatch:
    types: [machine-windows]
concurrency:
  group: windows-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: windows-latest
    timeout-minutes: 435
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download bore
        run: |
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .

      - name: Download ttyd
        run: |
          Invoke-WebRequest "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.win32.exe" -OutFile ttyd.exe

      - name: Download filebrowser
        run: |
          Invoke-WebRequest "https://github.com/filebrowser/filebrowser/releases/download/v2.63.23/windows-amd64-filebrowser.zip" -OutFile filebrowser.zip
          Expand-Archive filebrowser.zip -DestinationPath filebrowser-dist

      - name: Configure filebrowser
        run: |
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:TEMP\fb" | Out-Null
          Push-Location "$env:TEMP\fb"
          & $fb config init
          & $fb users add runner "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" --perm.admin
          Pop-Location

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" -Force)

      - name: Start the machine (keeps the machine alive)
        run: |
          # Everything the machine needs lives in this one step: services, tunnels and the
          # blocking wait. Windows runners tear down a step's processes when it completes,
          # so a "keep alive" step in a later shell could find nothing still running.
          Start-Process -FilePath ".\ttyd.exe" -ArgumentList @("-W","-p","8080","cmd.exe") -WindowStyle Hidden
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $fb -ArgumentList @("-r","C:\","-a","0.0.0.0","-p","8081") -WorkingDirectory "$env:TEMP\fb" -WindowStyle Hidden

          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","8080","--local-host","127.0.0.1","--to","bore.pub") -RedirectStandardOutput bore8080.out -RedirectStandardError bore8080.err
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","8081","--local-host","127.0.0.1","--to","bore.pub") -RedirectStandardOutput bore8081.out -RedirectStandardError bore8081.err
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","3389","--local-host","127.0.0.1","--to","bore.pub") -RedirectStandardOutput bore3389.out -RedirectStandardError bore3389.err

          function Get-BoreHost([string]$file) {
            $raw = Get-Content $file -Raw -ErrorAction SilentlyContinue
            if ($raw -match "listening at (\S+)") { return $matches[1] }
            return $null
          }

          $t = $null; $f = $null; $r = $null
          $deadline = (Get-Date).AddSeconds(60)
          while (-not ($t -and $f -and $r) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 4
            if (-not $t) { $t = Get-BoreHost "bore8080.err"; if (-not $t) { $t = Get-BoreHost "bore8080.out" } }
            if (-not $f) { $f = Get-BoreHost "bore8081.err"; if (-not $f) { $f = Get-BoreHost "bore8081.out" } }
            if (-not $r) { $r = Get-BoreHost "bore3389.err"; if (-not $r) { $r = Get-BoreHost "bore3389.out" } }
          }

          $PASS = "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"

          if ($t) { Write-Output "MAROHUB_TERMINAL=http://$t"; Write-Output "::notice title=Web terminal::http://$t" }
          if ($f) { Write-Output "MAROHUB_FILES=http://$f"; Write-Output "::notice title=File manager::http://$f  (user runner / password $PASS)" }
          if ($r) { Write-Output "MAROHUB_RDP=$r"; Write-Output "::notice title=Remote Desktop::$r  (user runneradmin / password $PASS)" }
          if (-not $t -and -not $f -and -not $r) {
            Write-Output "::error::bore did not report any endpoints."
            Get-Content bore8080.err,bore8081.err,bore3389.err,bore8080.out,bore8081.out,bore3389.out -ErrorAction SilentlyContinue
          }

          $summary = "## Windows machine`n`n"
          if ($t) { $summary += "* **Terminal** (any browser): http://$t`n" }
          if ($f) { $summary += "* **Files** (filebrowser): http://$f - user ``runner``, password ``$PASS`` `n" }
          if ($r) { $summary += "* **Desktop** (RDP client): $r - user ``runneradmin``, password ``$PASS`` `n" }
          $summary += "`n> The machine lives until this run ends or ~6h, whichever comes first."
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Publish live endpoints so the app can read them while the run is alive (run
          # logs are only archived after the run completes). Every command is in the same
          # step as the tunnels, and guarded so a hiccup can never take the machine down.
          try {
            $ep = @{}
            if ($t) { $ep["MAROHUB_TERMINAL"] = "http://$t" }
            if ($f) { $ep["MAROHUB_FILES"] = "http://$f" }
            if ($r) { $ep["MAROHUB_RDP"] = "$r" }
            $state = @{ run_id = $env:GITHUB_RUN_ID; endpoints = $ep } | ConvertTo-Json -Compress
            New-Item -ItemType Directory -Force -Path .machine-state | Out-Null
            Set-Content -Path .machine-state/windows.json -Value $state -NoNewline -Encoding utf8
            git config user.name "github-machine"
            git config user.email "github-machine@users.noreply.github.com"
            git checkout --orphan machine-state/windows 2>$null
            git rm -rf --cached . 2>$null
            git add .machine-state/windows.json
            git commit -m "machine state: $env:GITHUB_RUN_ID" 2>$null
            git push -f origin machine-state/windows 2>$null
          } catch {
            Write-Output "state publish skipped: $($_.Exception.Message)"
          }

          # Hold the run open until the machine is cancelled or the 6h window ends.
          Wait-Process -Name bore -ErrorAction SilentlyContinue