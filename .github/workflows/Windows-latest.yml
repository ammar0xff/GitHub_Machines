name: Windows

on:
  workflow_dispatch:
    inputs:
      auto_restart:
        description: 'Auto-restart session before GitHub 6h limit (keeps your tunnel alive indefinitely)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  boot:
    runs-on: windows-latest
    timeout-minutes: 355

    permissions:
      actions: write
      contents: read

    steps:
      - name: Download playit
        run: Invoke-WebRequest "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64-signed.exe" -OutFile playit.exe
        # playit.gg is free — sign up at https://playit.gg, create a secret key, and add it as PLAYIT_SECRET in your repo secrets.

      - name: Enable TS
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0

      - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

      - name: Auto-Restart Watchdog
        if: inputs.auto_restart == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          $watchdog = {
            param($token, $repo, $ref)
            # Sleep 5.5 hours then trigger a new session
            Start-Sleep -Seconds 19800
            $body = "{`"ref`":`"$ref`",`"inputs`":{`"auto_restart`":`"true`"}}"
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/workflows/Windows-latest.yml/dispatches" `
              -Method POST `
              -Headers @{ Authorization = "token $token"; Accept = "application/vnd.github.v3+json" } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "[watchdog] New session triggered. Reconnect via RDP in ~30s."
          }
          Start-Job -ScriptBlock $watchdog -ArgumentList $env:GH_TOKEN, $env:REPO, $env:REF | Out-Null
          Write-Host "[watchdog] Auto-restart watchdog started (will trigger at 5h 30m)"

      - name: Create Tunnel
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # The RDP address (host:port) will appear in the logs below.
          # Connect to it with any standard RDP client — no extra software needed on your side.
          .\playit.exe --secret $env:PLAYIT_SECRET
