name: Windows
on:
  workflow_dispatch:
  repository_dispatch:
    types: [machine-windows]
concurrency:
  group: windows-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: windows-latest
    timeout-minutes: 435
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download bore
        run: |
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .

      - name: Download ttyd
        run: |
          Invoke-WebRequest "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.win32.exe" -OutFile ttyd.exe

      - name: Download filebrowser
        run: |
          Invoke-WebRequest "https://github.com/filebrowser/filebrowser/releases/download/v2.63.23/windows-amd64-filebrowser.zip" -OutFile filebrowser.zip
          Expand-Archive filebrowser.zip -DestinationPath filebrowser-dist

      - name: Configure filebrowser
        run: |
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:TEMP\fb" | Out-Null
          Push-Location "$env:TEMP\fb"
          & $fb config init
          & $fb users add runner "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" --perm.admin
          Pop-Location

      - name: Enable Remote Desktop
        run: |
          # Force the SSL (TLS) security layer with NLA off. This makes the
          # embedded HTTPS relay deterministic: the runner answers a TLS
          # ClientHello first and accepts the X.224 Connection Request inside
          # TLS, with no CredSSP demanded. (SecurityLayer=0/1 vary per run and
          # break the relay, 'negotiate' machines pick HYBRID randomly.)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" -Force)

      - name: Download cloudflared
        run: |
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

      - name: Start the machine (keeps the machine alive)
        run: |
          # Everything the machine needs lives in this one step: services, tunnels and the
          # blocking wait. Windows runners tear down a step's processes when it completes,
          # so a "keep alive" step in a later shell could find nothing still running.
          $PASS = "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"
          # URL-encoded copy for the embedded-Desktop link; the raw value stays for
          # human-readable notices. Keeps '#'/'&'/'=' in custom passwords from truncating.
          $PASS_ENC = [uri]::EscapeDataString($PASS)
          Start-Process -FilePath ".\ttyd.exe" -ArgumentList @("-W","-p","8080","-b","/term","cmd.exe") -WindowStyle Hidden
          $fb = (Get-ChildItem -Recurse -Filter filebrowser.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $fb -ArgumentList @("-r","C:\","-a","0.0.0.0","-p","8081","-b","/files") -WorkingDirectory "$env:TEMP\fb" -WindowStyle Hidden

          $env:PORT = "8082"
          $env:KIND = "windows"
          $env:LABEL = "GitHub Machine - Windows"
          $env:USER = "runner | runneradmin"
          $env:PASS = $PASS
          $env:VNC = "0"
          $env:RDP = "1"
          $env:RDP_USER = "runneradmin"
          $env:RDP_ADDR = $r
          $env:TERM_STRIP = "0"
          $env:TTYD_PORT = "8080"
          $env:FB_PORT = "8081"
          $env:RELAY_LOG = "C:\relay.log"
          Start-Process -FilePath "node" -ArgumentList "$env:GITHUB_WORKSPACE\machine-console\console.js" -WindowStyle Hidden
          $ok = $false
          for ($n = 0; $n -lt 12 -and -not $ok; $n++) {
            if ($n -gt 0) { Start-Sleep -Seconds 5 }
            try { (Invoke-WebRequest "http://127.0.0.1:8082/healthz" -UseBasicParsing -TimeoutSec 5).Content | Out-Null; $ok = $true } catch { }
          }
          if (-not $ok) { Write-Error "console failed to start"; exit 1 }

          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList @("tunnel","--url","http://127.0.0.1:8082","--no-autoupdate") -RedirectStandardOutput cloudflared.out -RedirectStandardError cloudflared.err -WindowStyle Hidden
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","8082","--local-host","127.0.0.1","--to","bore.pub") -RedirectStandardOutput bore8082.out -RedirectStandardError bore8082.err
          Start-Process -FilePath ".\bore.exe" -ArgumentList @("local","3389","--local-host","127.0.0.1","--to","bore.pub") -RedirectStandardOutput bore3389.out -RedirectStandardError bore3389.err

          function Get-BoreHost([string]$file) {
            $raw = Get-Content $file -Raw -ErrorAction SilentlyContinue
            if ($raw -match "listening at (\S+)") { return $matches[1] }
            return $null
          }
          function Get-CfHost {
            $raw = (Get-Content cloudflared.out,cloudflared.err -Raw -ErrorAction SilentlyContinue)
            if ($raw -match "https://([a-z0-9-]+\.trycloudflare\.com)") { return $matches[0] }
            return $null
          }

          $c = $null; $b = $null; $r = $null
          $deadline = (Get-Date).AddSeconds(90)
          while (-not ($c -and $b -and $r) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 4
            if (-not $c) { $c = Get-CfHost }
            if (-not $b) { $b = Get-BoreHost "bore8082.err"; if (-not $b) { $b = Get-BoreHost "bore8082.out" } }
            if (-not $r) { $r = Get-BoreHost "bore3389.err"; if (-not $r) { $r = Get-BoreHost "bore3389.out" } }
          }

          $BASE = if ($c) { $c } elseif ($b) { "http://$b" } else { "" }
          if (-not $BASE) {
            Write-Output "::error::no console tunnel available."
            Get-Content cloudflared.out,cloudflared.err,bore8082.err,bore8082.out -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Output "CONSOLE_URL=$BASE"
          Write-Output "MAROHUB_CONSOLE=$BASE"; Write-Output "::notice title=Machine console::$BASE"
          Write-Output "::notice title=Web terminal::$BASE/term/"
          Write-Output "::notice title=File manager::$BASE/files  (user runner / password $PASS)"
          if ($r) {
            $RDP_URL = "$BASE/rdp/index.html?user=runneradmin&pass=$PASS_ENC"
            Write-Output "MAROHUB_DESKTOP=$RDP_URL"; Write-Output "::notice title=Desktop (embedded RDP)::$RDP_URL"
            Write-Output "MAROHUB_RDP=$r"; Write-Output "::notice title=Remote Desktop (native)::$r  (user runneradmin / password $PASS)"
          }

          $summary = "## Windows machine`n`n"
          $summary += "* **Console** (one URL - Desktop / Terminal / Files): $BASE`n"
          if ($r) { $summary += "* **Desktop** (embedded RDP): $BASE/rdp/index.html - user ``runneradmin``, password ``$PASS`` `n" }
          $summary += "* **Desktop** (native RDP client): $r - user ``runneradmin``, password ``$PASS`` `n"
          $summary += "`n> The machine lives until this run ends or ~6h, whichever comes first."
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Publish live endpoints so the app can read them while the run is alive (run
          # logs are only archived after the run completes). Every command is in the same
          # step as the tunnels, and guarded so a hiccup can never take the machine down.
          try {
            $ep = @{}
            $ep["MAROHUB_CONSOLE"] = $BASE
            $ep["MAROHUB_TERMINAL"] = "$BASE/term/"
            $ep["MAROHUB_FILES"] = "$BASE/files"
            if ($r) {
              $ep["MAROHUB_DESKTOP"] = "$BASE/rdp/index.html?user=runneradmin&pass=$PASS_ENC"
              $ep["MAROHUB_RDP"] = $r
            }
            $state = @{ run_id = $env:GITHUB_RUN_ID; endpoints = $ep } | ConvertTo-Json -Compress
            New-Item -ItemType Directory -Force -Path .machine-state | Out-Null
            Set-Content -Path .machine-state/windows.json -Value $state -NoNewline -Encoding utf8
            git config user.name "github-machine"
            git config user.email "github-machine@users.noreply.github.com"
            git checkout --orphan machine-state/windows 2>$null
            git rm -rf --cached . 2>$null
            git add .machine-state/windows.json
            git commit -m "machine state: $env:GITHUB_RUN_ID" 2>$null
            git push -f origin machine-state/windows 2>$null
          } catch {
            Write-Output "state publish skipped: $($_.Exception.Message)"
          }

          # Hold the run open until the machine is cancelled or the 6h window ends.
          Wait-Process -Name bore -ErrorAction SilentlyContinue