name: macOS
on:
  workflow_dispatch:
  repository_dispatch:
    types: [machine-macos]
concurrency:
  group: macos-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: macos-latest
    timeout-minutes: 435
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install gotty
        run: |
          curl -fsSL "https://github.com/yudai/gotty/releases/download/v1.0.1/gotty_darwin_amd64.tar.gz" -o gotty.tar.gz
          tar -xzf gotty.tar.gz
          sudo mv gotty /usr/local/bin

      - name: Install filebrowser
        run: |
          curl -fsSL "https://github.com/filebrowser/filebrowser/releases/download/v2.63.23/darwin-arm64-filebrowser.tar.gz" -o filebrowser.tar.gz
          tar -xzf filebrowser.tar.gz
          sudo mv filebrowser /usr/local/bin

      - name: "Install bore & cloudflared"
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            ASSET="bore-v0.6.0-aarch64-apple-darwin.tar.gz"
            CF_ASSET="cloudflared-darwin-arm64.tgz"
          else
            ASSET="bore-v0.6.0-x86_64-apple-darwin.tar.gz"
            CF_ASSET="cloudflared-darwin-amd64.tgz"
          fi
          curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/${ASSET}" -o bore.tar.gz
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/${CF_ASSET}" -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          sudo mv cloudflared /usr/local/bin

      - name: Configure filebrowser
        run: |
          cd /tmp
          filebrowser config init
          filebrowser users add runner "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" --perm.admin

      - name: Enable Screen Sharing (best effort)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" \
            || echo "Screen Sharing could not be enabled on this image"
          sleep 2

      - name: Start services
        run: |
          export TERM=xterm
          nohup gotty -w --title-format "GitHub Machine - macOS" /bin/bash > /tmp/gotty.log 2>&1 &
          cd /tmp && nohup /usr/local/bin/filebrowser -r / -a 0.0.0.0 -p 8081 -b /files > /tmp/filebrowser.log 2>&1 &
          PASS="${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"
          PORT=8082 KIND=macos LABEL="GitHub Machine - macOS" USER=runner "PASS=${PASS}" \
            VNC=0 TERM_STRIP=1 TTYD_PORT=8080 FB_PORT=8081 \
            nohup node "${GITHUB_WORKSPACE}/machine-console/console.js" > /tmp/console.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8082/healthz || { echo "console failed to start"; cat /tmp/console.log; exit 1; }

      - name: Start tunnels
        run: |
          # gotty (8090 bore) keeps the raw VNC/Screen Sharing reachable; everything else
          # (Terminal + Files) lives under one HTTPS origin via the console.
          cloudflared tunnel --url http://127.0.0.1:8082 --no-autoupdate > /tmp/cf.log 2>&1 &
          bore local 8082 --local-host 127.0.0.1 --to bore.pub > /tmp/t8082.log 2>&1 &
          bore local 5900 --local-host 127.0.0.1 --to bore.pub > /tmp/t5900.log 2>&1 &
          sleep 5

          C=""
          for i in $(seq 1 12); do
            C=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1)
            [ -n "$C" ] && break
            sleep 5
          done
          B=$(grep -oE 'listening at [A-Za-z0-9.-]+:[0-9]{2,5}' /tmp/t8082.log | head -n1 | grep -oE '[A-Za-z0-9.-]+:[0-9]{2,5}')
          V=$(grep -oE 'listening at [A-Za-z0-9.-]+:[0-9]{2,5}' /tmp/t5900.log | head -n1 | grep -oE '[A-Za-z0-9.-]+:[0-9]{2,5}')
          BASE="${C:-http://${B}}"
          PASS="${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"

          if [ -z "$BASE" ]; then
            echo "::error::no console tunnel available. Tunnel logs:"
            cat /tmp/cf.log /tmp/t8082.log
            exit 1
          fi
          echo "CONSOLE_URL=$BASE"
          echo "MAROHUB_CONSOLE=${BASE}" && echo "::notice title=Machine console::${BASE}"
          echo "::notice title=Web terminal::${BASE}/term/"
          echo "::notice title=File manager::${BASE}/files  (user runner / password ${PASS})"
          if [ -n "$V" ] && nc -z localhost 5900 2>/dev/null; then
            echo "MAROHUB_DESKTOP=http://${V}" && echo "::notice title=Desktop (VNC)::${V}  (user runner / password ${PASS})"
          else
            V=""
          fi

          {
            echo "## macOS machine"
            echo ""
            echo "* **Console** (one URL — Terminal / Files): ${BASE}"
            if [ -n "$V" ]; then echo "* **Desktop** (VNC client): ${V}  — user \`runner\`, password \`${PASS}\`"; fi
            if [ -z "$V" ]; then echo "* **Desktop**: not available — Screen Sharing is off on this image"; fi
            echo ""
            echo "> The machine lives until this run ends or ~6h, whichever comes first."
          } >> "$GITHUB_STEP_SUMMARY"

          # Publish live endpoints so the app can read them while the run is alive (run
          # logs are only archived after the run completes). Every step is guarded so a
          # publish hiccup can never take the machine down.
          mkdir -p .machine-state
          BODY="{\"run_id\":\"${GITHUB_RUN_ID}\",\"endpoints\":{"
          BODY="${BODY}\"MAROHUB_CONSOLE\":\"${BASE}\""
          BODY="${BODY},\"MAROHUB_TERMINAL\":\"${BASE}/term/\""
          BODY="${BODY},\"MAROHUB_FILES\":\"${BASE}/files\""
          [ -n "$V" ] && BODY="${BODY},\"MAROHUB_DESKTOP\":\"http://${V}\""
          BODY="${BODY}}}"
          printf '%s' "$BODY" > .machine-state/macos.json
          git config user.name "github-machine" >/dev/null 2>&1 || true
          git config user.email "github-machine@users.noreply.github.com" >/dev/null 2>&1 || true
          git checkout --orphan machine-state/macos >/dev/null 2>&1 || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add .machine-state/macos.json >/dev/null 2>&1 || true
          git commit -m "machine state: ${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          git push -f origin machine-state/macos >/dev/null 2>&1 || echo "state publish skipped"

      - name: Keep the machine alive
        run: |
          # Bore tunnels started in the previous step keep running as this job stays open,
          # so GitHub emits this run only when it is cancelled or the 6h window ends.
          tail -f /dev/null