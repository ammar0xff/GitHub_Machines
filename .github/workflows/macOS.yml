name: macOS
on: workflow_dispatch
concurrency:
  group: macos-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: macos-latest
    timeout-minutes: 435

    steps:
      - uses: actions/checkout@v4

      - name: Install gotty
        run: |
          curl -fsSL "https://github.com/yudai/gotty/releases/download/v1.0.1/gotty_darwin_amd64.tar.gz" -o gotty.tar.gz
          tar -xzf gotty.tar.gz
          sudo mv gotty /usr/local/bin

      - name: Install bore
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            ASSET="bore-v0.6.0-aarch64-apple-darwin.tar.gz"
          else
            ASSET="bore-v0.6.0-x86_64-apple-darwin.tar.gz"
          fi
          curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/${ASSET}" -o bore.tar.gz
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin

      - name: Start web terminal
        run: |
          export TERM=xterm
          nohup gotty -w --title-format "GitHub Machine - macOS" /bin/bash > /tmp/gotty.log 2>&1 &
          sleep 3

      - name: Start tunnel (keeps the machine alive)
        run: |
          bore local 8080 --to bore.pub > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          for i in $(seq 1 30); do
            grep -q 'listening at ' /tmp/bore.log && break
            sleep 2
          done
          ENDPOINT=$(grep -oE '[a-z0-9.-]+:[0-9]+' /tmp/bore.log | head -n1)
          if [ -n "$ENDPOINT" ]; then
            echo "::notice title=Web terminal::http://${ENDPOINT}"
            {
              echo "## macOS machine"
              echo ""
              echo "* Web terminal (any browser, any device): **http://${ENDPOINT}**"
              echo ""
              echo "> The machine lives until this run ends or ~6h, whichever comes first."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::bore did not report an endpoint. Tunnel log:"
            cat /tmp/bore.log
          fi
          wait $BORE_PID