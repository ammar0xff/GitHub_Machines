name: macOS
on:
  workflow_dispatch:
  repository_dispatch:
    types: [machine-macos]
concurrency:
  group: macos-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: macos-latest
    timeout-minutes: 435
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install gotty
        run: |
          curl -fsSL "https://github.com/yudai/gotty/releases/download/v1.0.1/gotty_darwin_amd64.tar.gz" -o gotty.tar.gz
          tar -xzf gotty.tar.gz
          sudo mv gotty /usr/local/bin

      - name: Install filebrowser
        run: |
          curl -fsSL "https://github.com/filebrowser/filebrowser/releases/download/v2.63.23/darwin-arm64-filebrowser.tar.gz" -o filebrowser.tar.gz
          tar -xzf filebrowser.tar.gz
          sudo mv filebrowser /usr/local/bin

      - name: Install bore
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            ASSET="bore-v0.6.0-aarch64-apple-darwin.tar.gz"
          else
            ASSET="bore-v0.6.0-x86_64-apple-darwin.tar.gz"
          fi
          curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/${ASSET}" -o bore.tar.gz
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin

      - name: Configure filebrowser
        run: |
          cd /tmp
          filebrowser config init
          filebrowser users add runner "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" --perm.admin

      - name: Enable Screen Sharing (best effort)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}" \
            || echo "Screen Sharing could not be enabled on this image"
          sleep 2

      - name: Start services
        run: |
          export TERM=xterm
          nohup gotty -w --title-format "GitHub Machine - macOS" /bin/bash > /tmp/gotty.log 2>&1 &
          cd /tmp && nohup /usr/local/bin/filebrowser -r / -a 0.0.0.0 -p 8081 > /tmp/filebrowser.log 2>&1 &
          sleep 3

      - name: Start tunnels
        run: |
          bore local 8080 --host 127.0.0.1 --to bore.pub > /tmp/t8080.log 2>&1 &
          bore local 8081 --host 127.0.0.1 --to bore.pub > /tmp/t8081.log 2>&1 &
          bore local 5900 --host 127.0.0.1 --to bore.pub > /tmp/t5900.log 2>&1 &
          sleep 8

          T=$(grep -oE 'listening at [A-Za-z0-9.-]+:[0-9]{2,5}' /tmp/t8080.log | head -n1 | grep -oE '[A-Za-z0-9.-]+:[0-9]{2,5}')
          F=$(grep -oE 'listening at [A-Za-z0-9.-]+:[0-9]{2,5}' /tmp/t8081.log | head -n1 | grep -oE '[A-Za-z0-9.-]+:[0-9]{2,5}')
          V=$(grep -oE 'listening at [A-Za-z0-9.-]+:[0-9]{2,5}' /tmp/t5900.log | head -n1 | grep -oE '[A-Za-z0-9.-]+:[0-9]{2,5}')
          PASS="${{ secrets.MACHINE_PASSWORD || 'P@ssw0rd!123' }}"

          [ -n "$T" ] && echo "MAROHUB_TERMINAL=http://${T}" && echo "::notice title=Web terminal::http://${T}"
          [ -n "$F" ] && echo "MAROHUB_FILES=http://${F}" && echo "::notice title=File manager::http://${F}  (user runner / password ${PASS})"
          if [ -n "$V" ] && nc -z localhost 5900 2>/dev/null; then
            echo "MAROHUB_DESKTOP=http://${V}" && echo "::notice title=Desktop (VNC)::${V}  (user runner / password ${PASS})"
          else
            V=""
          fi

          if [ -z "$T" ] && [ -z "$F" ] && [ -z "$V" ]; then
            echo "::error::bore did not report any endpoints. Tunnel logs:"
            cat /tmp/t8080.log /tmp/t8081.log /tmp/t5900.log
          fi

          {
            echo "## macOS machine"
            echo ""
            [ -n "$T" ] && echo "* **Terminal** (any browser): http://${T}"
            [ -n "$F" ] && echo "* **Files** (filebrowser): http://${F}  — user \`runner\`, password \`${PASS}\`"
            [ -n "$V" ] && echo "* **Desktop** (VNC client): ${V}  — user \`runner\`, password \`${PASS}\`"
            if [ -z "$V" ]; then echo "* **Desktop**: not available — Screen Sharing is off on this image (use Finder > Go > Connect to Server with \`vnc://…\` if enabled)"; fi
            echo ""
            echo "> The machine lives until this run ends or ~6h, whichever comes first."
          } >> "$GITHUB_STEP_SUMMARY"

          # Publish live endpoints so the app can read them while the run is alive (run
          # logs are only archived after the run completes). Every step is guarded so a
          # publish hiccup can never take the machine down.
          mkdir -p .machine-state
          BODY="{\"run_id\":\"${GITHUB_RUN_ID}\",\"endpoints\":{"
          BODY="${BODY}\"MAROHUB_TERMINAL\":\"http://${T}\""
          [ -n "$F" ] && BODY="${BODY},\"MAROHUB_FILES\":\"http://${F}\""
          [ -n "$V" ] && BODY="${BODY},\"MAROHUB_DESKTOP\":\"http://${V}\""
          BODY="${BODY}}}"
          printf '%s' "$BODY" > .machine-state/macos.json
          git config user.name "github-machine" >/dev/null 2>&1 || true
          git config user.email "github-machine@users.noreply.github.com" >/dev/null 2>&1 || true
          git checkout --orphan machine-state/macos >/dev/null 2>&1 || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add .machine-state/macos.json >/dev/null 2>&1 || true
          git commit -m "machine state: ${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          git push -f origin machine-state/macos >/dev/null 2>&1 || echo "state publish skipped"

      - name: Keep the machine alive
        run: |
          # Bore tunnels started in the previous step keep running as this job stays open,
          # so GitHub emits this run only when it is cancelled or the 6h window ends.
          tail -f /dev/null