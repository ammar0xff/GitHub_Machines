name: Ubuntu
on: workflow_dispatch
concurrency:
  group: ubuntu-machine
  cancel-in-progress: false

jobs:
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 435

    steps:
      - uses: actions/checkout@v4

      - name: Install ttyd
        run: |
          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" -o ttyd
          chmod +x ttyd
          sudo mv ttyd /usr/local/bin

      - name: Install bore
        run: |
          curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz" -o bore.tar.gz
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin

      - name: Start web terminal
        run: |
          export TERM=xterm
          nohup ttyd -W -p 8080 -t titleFixed="GitHub Machine - Ubuntu" bash > /tmp/ttyd.log 2>&1 &
          sleep 3

      - name: Start tunnel (keeps the machine alive)
        run: |
          bore local 8080 --to bore.pub > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          for i in $(seq 1 30); do
            grep -q 'listening at ' /tmp/bore.log && break
            sleep 2
          done
          ENDPOINT=$(grep -oE '[a-z0-9.-]+:[0-9]+' /tmp/bore.log | head -n1)
          if [ -n "$ENDPOINT" ]; then
            echo "::notice title=Web terminal::http://${ENDPOINT}"
            {
              echo "## Ubuntu machine"
              echo ""
              echo "* Web terminal (any browser, any device): **http://${ENDPOINT}**"
              echo ""
              echo "> The machine lives until this run ends or ~6h, whichever comes first."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::bore did not report an endpoint. Tunnel log:"
            cat /tmp/bore.log
          fi
          wait $BORE_PID